<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Highway Dash 3D</title>
<style>
:root{--ink:#10201f;--muted:#4b6260;--panel:rgba(238,245,244,.93);--accent:#e4572e;--line:rgba(16,32,31,.18);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8f1f0;--muted:#98b0ae;--panel:rgba(12,22,22,.92);--line:rgba(232,241,240,.2);color-scheme:dark}}
:root[data-theme="dark"]{--ink:#e8f1f0;--muted:#98b0ae;--panel:rgba(12,22,22,.92);--line:rgba(232,241,240,.2);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#9fd3ff}
body{font-family:"Trebuchet MS","Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:10px 14px;display:none;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.55);pointer-events:none}
#hud .r{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
#hud .big{font-size:1.5rem}
#bar{height:6px;border-radius:3px;background:rgba(255,255,255,.35);margin:6px 0;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#ffd23f}
#cnt{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:6rem;font-weight:800;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,.18)}
#ov.hide{display:none}
.card{background:var(--panel);border-radius:14px;padding:20px;width:100%;max-width:360px;max-height:100%;overflow:auto}
.card h1{margin:0 0 4px;font-size:1.5rem}
.card p{margin:0 0 12px;color:var(--muted);font-size:.92rem;line-height:1.4}
.row{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;min-width:0;font:inherit;font-size:.85rem;padding:9px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);-webkit-user-select:text;user-select:text}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--accent);color:#fff}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
ul{list-style:none;margin:0 0 14px;padding:0}
li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:.95rem}
li b{font-weight:700}
#start{width:100%}
#cars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}#cars button{padding:8px 4px;font-size:.8rem;background:transparent;color:var(--ink);border:1px solid var(--line)}#cars button.on{box-shadow:inset 0 0 0 2px var(--accent)}#cols{gap:10px}#cols button{width:28px;height:28px;padding:0;border-radius:50%;border:2px solid var(--line)}#cols button.on{outline:3px solid var(--accent);outline-offset:1px}
</style>
</head>
<body>
<canvas id="gl" aria-label="3D race view"></canvas>
<div id="hud"><div class="r"><span class="big" id="pos">1st</span><span class="big" id="spd">0 km/h</span></div><div id="bar"><i id="pg"></i></div><div class="r"><span id="env"></span><span id="dst"></span></div></div>
<div id="cnt"></div>
<div id="ov"><div class="card">

  <div class="row"><input id="lnk" readonly aria-label="Join link"><button class="alt" id="cp">Copy</button></div></div>
  <p>Choose your car</p><div id="cars"></div><div id="cols" class="row"></div>
  <ul id="pl"></ul>
  <button id="start">Start race</button>
</div></div>

  function setPeers(map,self){peers=Object.keys(map).filter(function(k){return k!==self}).map(function(k){return{isMe:false,peer:k,presence:map[k]||{}}});cb()}
  if(!isGuest){
    P=new Peer('hd-'+code);
    P.on('connection',function(c){conns.push(c);
      c.on('data',function(m){if(m&&m.t==='p'&&m.p)players[c.peer]=m.p});
      c.on('close',function(){delete players[c.peer];conns=conns.filter(function(x){return x!==c})})});
    setInterval(function(){players.host=pres;var snap={};for(var k in players)snap[k]=players[k];setPeers(snap,'host');
      conns.forEach(function(c){if(c.open)c.send({t:'all',ts:T(),players:snap})})},100);
  }else{
    P=new Peer();
    P.on('open',function(id){var c=P.connect('hd-'+code);
      c.on('open',function(){setInterval(function(){if(c.open)c.send({t:'p',p:pres})},100)});
      c.on('data',function(m){if(m&&m.t==='all'){var n=m.ts-(performance.timeOrigin+performance.now());if(!skewSet){skew=n;skewSet=1}else skew+=(n-skew)*.1;setPeers(m.players,id)}});
      c.on('close',function(){$('sub').textContent='Disconnected from the host.'})});
  }
  P.on('error',function(){$('sub').textContent='Could not connect. Ask your friend to resend the link.'});
  room.onPeers(onPeers);
}
mkNet();renderList();
// --- loop
function ord(n){return n+(n===1?'st':n===2?'nd':n===3?'rd':'th')}
var last=performance.now(),acc=0;
function frame(t){
  var dt=Math.min(.05,(t-last)/1000);last=t;var now=T();
  env(dt);
  if(state==='count'){var rem=(go-now)/1000;$('cnt').textContent=rem>0?Math.ceil(rem):'Go!';if(rem<=0){state='race';setTimeout(function(){if(state==='race')$('cnt').style.display='none'},700)}}
  if(state==='race'||state==='done'){
    rt=Math.max(0,(now-go)/1000);
    var dir=keys||touch;
    if(state==='race'){
      v=Math.min(Math.min(52,34+rt*.12),v+14*dt);
      var g=cur.grip;vx+=(dir*9-vx)*Math.min(1,dt*9*g);x=Math.max(-5.2,Math.min(5.2,x+vx*dt));
      if(Math.abs(x)>=5.2)vx=0;
      inv=Math.max(0,inv-dt);dist+=v*dt;
      while(60+ROW*nextRow+TS*rt<dist-2.5){score+=lanes(nextRow).length;nextRow++}
    }else{v=Math.max(0,v-20*dt);dist+=v*dt;vx*=.9;results()}
  }else{v=Math.max(0,v-10*dt)}
  // scenery scroll
  var o=dist%12;dashes.forEach(function(d){d.position.z=10-d.userData.k*12+o});var o4=dist%4;posts.forEach(function(p){p.position.z=10-p.userData.k*4+o4});rT.offset.y=dist/8.333;gT.offset.y=dist/5;
  var o2=dist%16;trees.forEach(function(tr){var u=tr.userData;tr.position.set((u.s?1:-1)*(9+u.j),0,10-u.k*16+o2-(u.s?8:0))});
  traffic();
  player.position.set(x,0,0);player.rotation.z=-vx*.025;player.rotation.y=-vx*.035;
  // opponents
  var seen={};
  others().forEach(function(p){var q=p.presence;if(q.g!==go||(q.s!=='r'&&q.s!=='d'))return;
    var id=p.peer;seen[id]=1;var m=opp[id];if(!m){m=opp[id]=mkCar((+q.m||0)%MD.length,(+q.c||0)%COLS.length);scene.add(m);m.userData.d=+q.d;m.userData.x=+q.x}
    m.userData.d+=((+q.d+(+q.v||0)*.1)-m.userData.d)*.25;m.userData.x+=((+q.x||0)-m.userData.x)*.25;
    var z=-(m.userData.d-dist);m.position.set(m.userData.x,0,z);m.visible=z>-200&&z<14});
  for(var id in opp)if(!seen[id]){scene.remove(opp[id]);delete opp[id]}
  shake=Math.max(0,shake-dt);
  var cx=x*.55+(shake?(Math.random()-.5)*shake:0);
  cam.position.set(cx,3.5,9.2);cam.lookAt(x*.55,1.2,-12);cam.fov=(innerWidth/innerHeight<1?78:62)+v*.15;cam.updateProjectionMatrix();
  parts(dt,t/1000);
  if(state==='race'||state==='done'||state==='count'){
    var rank=1;others().forEach(function(p){var q=p.presence;if(q.g===go&&(q.s==='r'||q.s==='d')&&+q.p>score)rank++});
    var tot=1;others().forEach(function(p){if(p.presence.g===go)tot++});
    $('pos').textContent=score+' pts';$('spd').textContent=Math.round(v*3.6)+' km/h';
    $('pg').style.width=((T()%PH)/PH*100)+'%';$('dst').textContent=(tot>1?ord(rank)+' of '+tot+' · ':'')+Math.round(dist)+' m'}
  if(t-lastSend>100){lastSend=t;send()}
  R.render(scene,cam);requestAnimationFrame(frame);
}
function rs(){var w=innerWidth,hh=innerHeight;R.setSize(w,hh,false);cam.aspect=w/hh;cam.fov=w/hh<1?78:62;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
addEventListener('keydown',function(e){var k=e.key;if(k==='ArrowLeft'||k==='a')keys=-1;else if(k==='ArrowRight'||k==='d')keys=1;else if((k==='Enter'||k===' ')&&(state==='lobby'||state==='done')){e.preventDefault();startNow()}});
addEventListener('keyup',function(e){var k=e.key;if(k==='ArrowLeft'||k==='a'||k==='ArrowRight'||k==='d')keys=0});
cv.addEventListener('pointerdown',function(e){touch=e.clientX<innerWidth/2?-1:1});
addEventListener('pointerup',function(){touch=0});addEventListener('pointercancel',function(){touch=0});
renderList();requestAnimationFrame(frame);
})();
</script>
